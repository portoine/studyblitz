<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyBlitz — Log In</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-logo">⚡ StudyBlitz</div>
  <h1>Welcome back</h1>
  <form id="login-form" autocomplete="on">
    <input type="text" name="username" placeholder="Username or email" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <div class="auth-error" id="login-error"></div>
    <button type="submit" class="btn-primary">Log in</button>
  </form>
  <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
</div>
<script>
document.getElementById("login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({username: fd.get("username"), password: fd.get("password")})
  });
  const d = await res.json();
  if (d.ok) { location.href = "/dashboard"; }
  else { document.getElementById("login-error").textContent = d.error; }
});
</script>
</body>
</html>
